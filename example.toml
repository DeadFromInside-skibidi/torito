# Torito example manifest — a small Arch-based live system
# =========================================================
# Build:   python -m torito example.toml -v
# Result:  output/mylinux-x86_64.iso (boots on BIOS and UEFI, CD/DVD or USB)
#
# Everything below is optional except `name`. If `packages` has no kernel
# or no `base`, Torito adds `linux` / `base` for you.
#
# TOML gotcha: plain `key = value` settings must come before the first
# [table] / [[table]] header — after one, they belong to that table.
# Torito warns about keys it does not recognise.

name        = "MyLinux"
version     = "1.0.0"
arch        = "x86_64"
hostname    = "mylinux"
locale      = "en_US.UTF-8"
timezone    = "UTC"
keymap      = "us"
default_target = "multi-user.target"      # or "graphical.target"
# source_date_epoch = 1700000000          # reproducible timestamps

cache_dir = ".torito-cache"               # package cache (reused between builds)
work_dir  = ".torito-work"

# --- Packages ------------------------------------------------------------------
# Names are resolved (with dependencies) from the repositories below. Strings
# that look like files ("pkgs/foo-1-1-x86_64.pkg.tar.zst") are installed from
# disk instead. A kernel package is required for a bootable image.
packages = [
    "base", "linux", "linux-firmware",
    "networkmanager", "openssh", "sudo", "nano",
]

# Without [[repositories]] Torito uses Arch Linux core + extra.
# [[repositories]]
# name    = "core"
# servers = ["https://fastly.mirror.pkgbuild.com/$repo/os/$arch"]
# [[repositories]]
# name    = "extra"
# servers = ["https://fastly.mirror.pkgbuild.com/$repo/os/$arch"]

# Pick a provider when several packages provide the same thing.
package_preferences = { jack = "pipewire-jack" }
# ignore_packages = ["some-dependency"]

# --- Files -----------------------------------------------------------------------
# Host directories laid over / (Windows CRLF line endings are converted).
rootfs_overlay_dirs = ["overlays/rootfs"]

# owner:group:mode — Windows cannot express Linux permissions, set them here.
file_permissions = { "/etc/sudoers.d/10-wheel" = "0:0:440" }

# Trim the image.
remove_paths = ["/usr/share/doc", "/usr/share/gtk-doc"]

# --- Users & services ------------------------------------------------------------
[[users]]
name     = "live"
password = "live"                        # SHA-512 hashed at build time; "" = no password
groups   = ["wheel", "audio", "video", "network", "storage"]

[[users]]
name     = "root"
password = "root"

[[services]]
name = "NetworkManager"                  # honours [Install] WantedBy/Alias/Also

[[services]]
name = "sshd"

# [[services]]
# name = "pipewire.socket"
# user = true                            # systemctl --global enable

# --- Networking --------------------------------------------------------------------
# With no network manager enabled above, Torito sets up systemd-networkd (DHCP
# on every wired interface) + systemd-resolved so the live system is online.
# [network]
# auto = false                            # opt out

# --- Boot --------------------------------------------------------------------------
[kernel]
cmdline = "quiet"                         # appended to Torito's live arguments
# package = "linux-lts"                   # pick a kernel when several are installed
# initramfs_modules = ["nvme"]            # extra drivers for the live initramfs

[bootloader]
bios       = "syslinux"                   # or "none"
uefi       = "systemd-boot"               # or "none"
timeout    = 5
menu_title = "MyLinux 1.0.0"

[live]
copytoram      = false                    # boot entry "copy to RAM" is always offered
overlay_size   = "75%"                    # tmpfs size for writes
serial_console = true                     # also log to ttyS0 (handy for VMs/CI)

# --- Output ------------------------------------------------------------------------
[iso]
output               = "output/mylinux-x86_64.iso"
volume_id            = "MYLINUX_LIVE"     # also how the initramfs finds the medium
publisher_id         = "MyLinux Project"
application_id       = "MyLinux Live"
squashfs_compression = "zstd"             # zstd | xz | gzip
squashfs_block_size  = 1048576
squashfs_level       = 15
