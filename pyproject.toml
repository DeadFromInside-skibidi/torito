[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "torito"
version = "1.0.0"
description = "Rootless Linux ISO Compiler — synthesise bootable hybrid BIOS/UEFI Linux ISOs directly on Windows"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "DeadFromInside"}]
keywords = ["linux", "iso", "compiler", "bootable", "uefi", "bios", "squashfs", "rootless"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Operating System",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "zstandard>=0.21.0",
    "tomli>=2.0.0;python_version<'3.11'",
]

[project.scripts]
torito = "torito.__main__:main"

[project.gui-scripts]
torito-gui = "torito.gui:main"

[tool.setuptools.packages.find]
include = ["torito*"]

