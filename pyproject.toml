[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torito"
version = "2.1.0"
description = "Build bootable BIOS/UEFI live Linux ISOs on Windows in pure Python - no WSL, Docker, VM or admin rights"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "DeadFromInside"}]
keywords = ["linux", "iso", "live-cd", "archlinux", "bootable", "uefi", "bios", "squashfs", "windows", "rootless", "archiso"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Operating System",
    "Topic :: System :: Boot",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "zstandard>=0.21.0",
    "tomli>=2.0.0;python_version<'3.11'",
]

[project.urls]
Homepage = "https://github.com/DeadFromInside-skibidi/torito"
Issues = "https://github.com/DeadFromInside-skibidi/torito/issues"
Changelog = "https://github.com/DeadFromInside-skibidi/torito/blob/main/CHANGELOG.md"

[project.scripts]
torito = "torito.__main__:main"

[project.gui-scripts]
torito-gui = "torito.gui:main"

[tool.setuptools.packages.find]
include = ["torito*"]
